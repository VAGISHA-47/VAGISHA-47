<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VAGISHA YADAV Banner</title>
  <style>
    :root {
      --bg: #0d1117;
      --pink: #f472b6;
      --purple: #a78bfa;
      --blue: #60a5fa;
      --green: #34d399;
      --white: #f8fafc;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .banner {
      position: relative;
      width: 900px;
      height: 280px;
      overflow: hidden;
      background: linear-gradient(120deg, #1a0533, #0d1b4b, #0a2e2e, #1a0533);
      background-size: 400% 400%;
      animation: gradientShift 18s ease-in-out infinite;
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 48px;
      width: 100%;
      box-sizing: border-box;
    }

    .name {
      margin: 0;
      font-size: 3.5rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff6ec7, #a78bfa, #60a5fa, #34d399, #ff6ec7);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 8s ease-in-out infinite;
      text-shadow: 0 0 18px rgba(255, 110, 199, 0.24), 0 0 36px rgba(96, 165, 250, 0.16);
      filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.18));
    }

    .subtitle {
      margin: 14px 0 0;
      font-size: 0.98rem;
      font-weight: 500;
      letter-spacing: 2px;
      color: rgba(248, 250, 252, 0.92);
      text-transform: uppercase;
    }

    .divider {
      position: relative;
      width: min(520px, 78vw);
      height: 2px;
      margin: 18px auto 0;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      border-radius: 999px;
    }

    .divider::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, #ff6ec7, #a78bfa, #60a5fa, #34d399, transparent);
      background-size: 200% 100%;
      animation: lineSweep 4.5s ease-in-out infinite;
    }

    .typing-wrap {
      margin-top: 24px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .typing-text {
      font-family: "Brush Script MT", "Segoe Script", "Snell Roundhand", cursive;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--pink);
      text-shadow: 0 0 14px rgba(244, 114, 182, 0.35);
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .cursor {
      display: inline-block;
      margin-left: 2px;
      color: var(--pink);
      animation: blink 1s steps(1) infinite;
    }

    .particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(167,139,250,0.85) 35%, rgba(167,139,250,0) 72%);
      filter: blur(0.15px) drop-shadow(0 0 7px rgba(167, 139, 250, 0.75));
      opacity: var(--opacity);
      animation: floatDot var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
      transform: translate3d(0, 0, 0);
    }

    .scanlines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.03) 0,
        rgba(255, 255, 255, 0.01) 1px,
        transparent 2px,
        transparent 4px
      );
      background-size: 100% 4px;
      mix-blend-mode: soft-light;
      opacity: 0.28;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 0 40%, rgba(13, 17, 23, 0.18) 72%, rgba(13, 17, 23, 0.42) 100%);
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes lineSweep {
      0% {
        transform: translateX(-35%);
        opacity: 0.3;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateX(35%);
        opacity: 0.3;
      }
    }

    @keyframes floatDot {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(calc(var(--drift) * -1)) scale(1.08);
      }
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 920px) {
      .banner {
        width: 100vw;
      }

      .content {
        padding: 0 24px;
      }

      .name {
        font-size: clamp(2.1rem, 8vw, 3.5rem);
        letter-spacing: 0.08em;
      }

      .subtitle {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <div class="banner" role="img" aria-label="Animated GitHub profile banner for VAGISHA YADAV">
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="content">
      <h1 class="name">VAGISHA YADAV</h1>
      <p class="subtitle">Software Developer | B.Tech CSE | Bhopal</p>
      <div class="divider" aria-hidden="true"></div>
      <div class="typing-wrap">
        <div class="typing-text"><span id="typedText"></span><span class="cursor">|</span></div>
      </div>
    </div>
  </div>

  <script>
    // Build the floating particles so the banner stays compact and easy to tweak.
    const particles = document.getElementById('particles');
    const particleCount = 13;

    for (let index = 0; index < particleCount; index += 1) {
      const particle = document.createElement('span');
      const size = 3 + Math.random() * 4;
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const duration = 5 + Math.random() * 6;
      const delay = Math.random() * -6;
      const opacity = 0.22 + Math.random() * 0.38;
      const drift = 10 + Math.random() * 18;

      particle.className = 'particle';
      particle.style.setProperty('--size', `${size}px`);
      particle.style.setProperty('--x', `${x}%`);
      particle.style.setProperty('--y', `${y}%`);
      particle.style.setProperty('--duration', `${duration}s`);
      particle.style.setProperty('--delay', `${delay}s`);
      particle.style.setProperty('--opacity', opacity);
      particle.style.setProperty('--drift', `${drift}px`);

      particles.appendChild(particle);
    }

    const phrases = [
      '✨ Full Stack Developer',
      '🚀 DSA Enthusiast',
      '💡 Problem Solver',
      '🎯 Open Source Contributor',
      '🌟 Building Cool Things',
    ];

    const typedText = document.getElementById('typedText');
    const typeDelay = 72;
    const deleteDelay = 42;
    const holdDelay = 2000;

    let phraseIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function scheduleNextTick(delay) {
      window.setTimeout(typeLoop, delay);
    }

    function typeLoop() {
      const currentPhrase = phrases[phraseIndex];

      if (!deleting) {
        charIndex += 1;
        typedText.textContent = currentPhrase.slice(0, charIndex);

        if (charIndex < currentPhrase.length) {
          scheduleNextTick(typeDelay);
          return;
        }

        deleting = true;
        scheduleNextTick(holdDelay);
        return;
      }

      charIndex -= 1;
      typedText.textContent = currentPhrase.slice(0, charIndex);

      if (charIndex > 0) {
        scheduleNextTick(deleteDelay);
        return;
      }

      deleting = false;
      phraseIndex = (phraseIndex + 1) % phrases.length;
      scheduleNextTick(500);
    }

    typeLoop();
  </script>
</body>
</html>
